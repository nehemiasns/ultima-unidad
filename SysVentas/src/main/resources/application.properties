# ===== H2 Base de datos embebida (archivo) =====
#db.url=jdbc:h2:file:./data/sysventas;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE
db.url=jdbc:h2:tcp://localhost:9092/./data/sysventas;DB_CLOSE_ON_EXIT=FALSE
db.h2server.enabled=true
db.h2server.port=9092
db.h2server.allowOthers=true


db.driver=org.h2.Driver
db.username=sa
db.password=
# ===== HikariCP Pool de conexiones =====
db.pool.maximumPoolSize=5
db.pool.minimumIdle=1
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
# ===== DDL Inicializacion automatica de tablas =====
# true ejecuta schema.sql al arrancar si las tablas no existen# false / true no toca el esquema
db.ddl.auto=true
db.ddl.script=schema_sv.sql